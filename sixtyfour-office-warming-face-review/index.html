<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Sixtyfour Office Warming · Face Review</title>
  <style>
    :root{color-scheme:dark;--bg:#0a0a0b;--panel:#141416;--panel2:#1b1b1f;--line:#29292f;--text:#f5f5f7;--muted:#a1a1aa;--soft:#71717a}
    *{box-sizing:border-box} html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{padding-bottom:48px} a{color:inherit}.topbar{position:sticky;top:0;z-index:20;background:rgba(10,10,11,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
    .controls{max-width:1280px;margin:0 auto;padding:12px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.title{font-weight:750;margin-right:auto;white-space:nowrap}
    button,.chip{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:9px 12px;font:inherit;cursor:pointer}
    button:hover,.chip:hover{background:var(--panel2)}button.active,.chip.active,.primary{background:#f4f4f5;color:#111;border-color:#f4f4f5}
    .filters{max-width:1280px;margin:12px auto 0;padding:0 18px;display:flex;gap:7px;overflow:auto;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.chip{padding:6px 10px;font-size:13px;white-space:nowrap}
    main{max-width:1280px;margin:0 auto;padding:18px}.summary{display:flex;gap:12px;align-items:baseline;margin:0 0 14px}.summary h1{font-size:18px;margin:0}.summary span{color:var(--muted);font-size:14px}
    .grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}.person-card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:15px;overflow:hidden;min-width:0}
    .photo-wrap{aspect-ratio:1/1;background:#202024}.avatar,.placeholder{width:100%;height:100%;display:grid;place-items:center;object-fit:cover;background:#232329;color:#8b8b95;font-weight:800;font-size:30px}
    .person-meta{padding:12px}.name-row{display:flex;gap:8px;align-items:flex-start}.name-row h2{font-size:15px;line-height:1.25;margin:0;flex:1}.person-meta p{font-size:12px;line-height:1.4;color:var(--muted);margin:7px 0 0;min-height:34px}
    .type-badge{display:inline-block;font-size:10px;border:1px solid #34343b;border-radius:999px;padding:3px 6px;color:#c5c5cc;white-space:nowrap}.profile-link{display:inline-block;margin-top:8px;font-size:11px;color:#d4d4d8;text-decoration:none}
    .quiz-hidden .photo-wrap{filter:none}.concealed{visibility:hidden}.reveal-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.85),rgba(0,0,0,0) 65%);border:0;border-radius:0;display:flex;align-items:flex-end;justify-content:center;padding:16px;color:white}.reveal-overlay span{font-size:12px;color:#d4d4d8}
    .flash-shell{max-width:590px;margin:14px auto 0;text-align:center}.flash-count{font-size:13px;color:var(--muted);margin-bottom:10px}.flash-photo{aspect-ratio:1/1;max-height:58vh;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:var(--panel)}
    .flash-avatar{width:100%;height:100%;object-fit:cover}.flash-answer{min-height:112px;padding:15px}.flash-answer h2{margin:0 0 6px;font-size:22px}.flash-answer p{color:var(--muted);margin:0 0 8px}.flash-answer .profile-link{display:block}
    .flash-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}.empty{text-align:center;color:var(--muted);padding:60px}
    @media(max-width:980px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:720px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.controls{padding:10px 12px}.filters,main{padding-left:12px;padding-right:12px}}
    @media(max-width:520px){.title{width:100%;margin-bottom:2px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.person-meta{padding:10px}.person-meta p{min-height:0}.name-row{display:block}.type-badge{margin-top:6px}.flash-actions{grid-template-columns:1fr 1fr}.flash-actions #revealBtn{grid-column:1/-1;grid-row:1}.flash-photo{max-height:none}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="controls">
      <div class="title">Sixtyfour Office Warming</div>
      <button class="active" data-mode="grid">Grid</button>
      <button data-mode="quiz">Grid Quiz</button>
      <button data-mode="flash">Flashcards</button>
      <button id="shuffleBtn">Shuffle</button>
    </div>
  </header>
  <div id="typeFilters" class="filters"></div>
  <main>
    <div class="summary"><h1>Face Review</h1><span id="count"></span></div>
    <section id="grid" class="grid"></section>
    <section id="flash" hidden></section>
  </main>
  <script src="data1.js"></script>
  <script src="data2.js"></script>
  <script src="data3.js"></script>
  <script src="data4.js"></script>
  <script src="data5.js"></script>
  <script src="app.js"></script>
</body>
</html>
