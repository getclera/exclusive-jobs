<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Face Review</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b0b0c;color:#f4f4f5}
header{position:sticky;top:0;z-index:10;background:rgba(11,11,12,.94);backdrop-filter:blur(12px);border-bottom:1px solid #27272a;padding:14px 18px}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;max-width:1450px;margin:auto}h1{font-size:18px;margin:0 8px 0 0}.muted{color:#a1a1aa;font-size:13px}
button,select{background:#18181b;color:#f4f4f5;border:1px solid #3f3f46;border-radius:9px;padding:8px 11px;font-size:14px;cursor:pointer}button.active{background:#f4f4f5;color:#111}
main{max-width:1450px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.card{background:#151517;border:1px solid #27272a;border-radius:14px;overflow:hidden;cursor:pointer(min-height:244px}.face{width:100%;aspect-ratio:1/1;object-fit:cover;background:#222}
.placeholder{display:flex;align-items:center;justify-content:center;font-size:42px;color:#71717a;width:100%;aspect-ratio:1/1;background:#202024}
.info{padding:10px 11px 12px}.name{font-weight:700;font-size:15px;line-height:1.25}.role{font-size:12px;color:#a1a1aa;line-height:1.35;margin-top:5px}.owner{font-size:11px;color:#71717a;margin-top:7px}
body.quiz .info{visibility:hidden}body.quiz .card.revealed .info{visibility:visible}body.quiz .card{min-height:200px}
.flash{display:none;max-width:560px;margin:18px auto;text-align:center}.flash.on{display:block}.flash-card{border:1px solid #27272a;background:#151517;border-radius:18px;overflow:hidden}
.flash img,.flash .placeholder{width:100%;aspect-ratio:1/1;object-fit:cover}.flash-info{padding:18px;min-height:100px}.flash-info.hidden{visibility:hidden}.controls{display:flex;gap:10px;justify-content:center;margin-top:14px}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}main{padding:10px}}
</style>
</head>
<body>
<header><div class="top"><h1>Face Review</h1><span class="muted" id="count"></span><button id="gridBtn" class="active">Grid</button><button id="quizBtn">Grid quiz</button><button id="flashBtn">Flashcards</button><button id="shuffleBtn">Shuffle</button><select id="ownerFilter"><option value="">Everyone</option><option value="Alex">Alex</option><option value="Seb">Seb</option></select></div></header>
<main><div id="grid" class="grid"></div><div id="flash" class="flash"><div class="flash-card"><div id="flashMedia"></div><div id="flashInfo" class="flash-info hidden"></div></div><div class="controls"><button id="prevBtn">← Previous</button><button id="revealBtn">Reveal</button><button id="nextBtn">Next →</button></div></div></main>
<script src="data1.js"></script><script src="data2.js"></script><script src="data3.js"></script><script src="data4.js"></script><script src="app.js"></script>
</body></html>
